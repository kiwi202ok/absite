<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uylar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- UY TANLASH -->
    <div id="houses" class="card">
        <h1>🏠 Uyni tanlang</h1>
        <button onclick="openHouse('beltepa')">Bel-Tepa</button>
        <button onclick="openHouse('oxunboboyev')">Oxunboboyev</button>
    </div>

    <!-- XIZMATLAR -->
    <div id="services" class="card hidden">
        <h2 id="houseTitle"></h2>

        <button onclick="showInfo('wifi')">📶 WiFi</button>
        <button onclick="showInfo('gaz')">🔥 Gaz</button>
        <button onclick="showInfo('suvsovuq')">🚿 Sovuq suv</button>
        <button onclick="showInfo('suvissiq')">🚿 Issiq suv</button>
        <button onclick="showInfo('kadaster')">📄 Kadaster</button>
        <button onclick="showInfo('propiska')">📘 Propiska</button>
        <button onclick="showInfo('musor')">Musor</button>

        <button class="secondary" onclick="goBack()">⬅ Orqaga</button>
    </div>

    <!-- MA’LUMOT -->
    <div id="info" class="card hidden">
        <div id="infoContent"></div>
        <button class="secondary" onclick="closeInfo()">⬅ Orqaga</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
